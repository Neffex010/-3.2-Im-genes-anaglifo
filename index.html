<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Estereoscópico Anaglifo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👓</text></svg>">
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm custom-navbar">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand mb-0 h2 anaglyph-title">👓 Visor Estereoscópico Anaglifo</span>
        </div>
    </nav>

    <main class="container mt-5 mb-5 d-flex flex-column align-items-center">
        
        <p class="text-center text-muted mb-4 subtitle-glow">Galería 3D - Requiere Gafas Rojo/Cian</p>

        <div class="carousel-wrapper w-100">
            <div id="carouselAnaglifo" class="carousel slide shadow-lg" data-bs-ride="carousel">
                <div class="carousel-inner rounded-3">
                    <div class="carousel-item active">
                        <img src="img/anaglifo/1.jpg" class="d-block w-100" alt="Imagen Anaglifo 1">
                    </div>
                    <div class="carousel-item">
                        <img src="img/anaglifo/2.jpg" class="d-block w-100" alt="Imagen Anaglifo 2">
                    </div>
                    <div class="carousel-item">
                        <img src="img/anaglifo/3.jpg" class="d-block w-100" alt="Imagen Anaglifo 3">
                    </div>
                    </div>
                
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselAnaglifo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselAnaglifo" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>

    </main>

    <footer class="text-white text-center py-4 mt-auto custom-footer">
        <div class="container">
            <p class="mb-1 fw-bold text-light">Desarrollado por [Tu Nombre Completo]</p>
            <p class="mb-0 small text-secondary">Estudiante de Ingeniería en Tecnologías de la Información y Comunicaciones (ITICS)</p>
            <p class="mb-0 small text-secondary">Tecnológico de Pachuca</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
